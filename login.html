
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>다픽 | 로그인</title>

  <!-- 폰트 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Noto+Sans+KR:wght@400;500;600;700;900&display=swap" rel="stylesheet">

  <!-- 공통 CSS -->
  <link rel="stylesheet" href="css/reset.css">
  <link rel="stylesheet" href="css/common/common.css">

  <!-- 로그인 전용 CSS -->
  <link rel="stylesheet" href="css/login.css">
</head>
<body>

<!-- ── GNB ── -->
<header class="gnb">
  <div class="gnb-top">
    <a class="logo" href="index.html">
      <img src="assets/logos/dapick.png" alt="다픽 아이콘" class="logo-wrap__img" />
    </a>
  </div>
</header>

<!-- ── 로그인 본문 ── -->
<main class="login-wrap">
  <div class="login-card">

    <!-- 헤더 (로고 + 태그라인) -->
    <div class="login-header">
      <a class="login-brand" href="index.html">
      <img src="assets/logos/dapick.png" alt="다픽 아이콘" class="logo-wrap__img" />
      </a>
      <p class="login-tagline">휴대폰 · 인터넷 · 카드 · 가전렌탈<br>다픽의 생활 플랫폼</p>
    </div>

    <!-- ── 소셜 버튼 그룹 ── -->
    <div class="social-group">

      <!-- 카카오 말풍선 -->
      <div class="kakao-balloon">카카오로 3초만에 시작하기</div>

      <!-- 카카오 -->
      <button class="social-btn btn-kakao" onclick="socialLogin('kakao')">
        <svg class="social-icon" viewBox="0 0 24 24">
          <path d="M12 3C6.48 3 2 6.72 2 11.28c0 2.9 1.78 5.45 4.47 6.94L5.4 22l4.29-2.96A12.2 12.2 0 0012 19.56c5.52 0 10-3.72 10-8.28C22 6.72 17.52 3 12 3z" fill="#191919"/>
        </svg>
        카카오로 시작하기
      </button>

      <!-- 네이버 -->
      <button class="social-btn btn-naver" onclick="socialLogin('naver')">
        <svg class="social-icon" viewBox="0 0 24 24">
          <path d="M13.5 12.6L10.2 7H7v10h3.5V11.4L14.1 17H17V7h-3.5v5.6z" fill="white"/>
        </svg>
        네이버로 시작하기
        <span class="soon-badge">준비중</span>
      </button>
    </div><!-- /social-group -->

    <!-- 구분선 -->
    <div class="login-divider">회원시스템</div>

    <!-- 회원가입 안내 (신규 박음) -->
    <a href="signup.html" class="signup-link">
      처음이신가요? <strong>회원가입</strong>
    </a>

    <!-- 이메일 로그인 토글 링크 -->
    <a class="email-login-link" href="#" id="email-toggle" onclick="toggleEmail(event)">
      이메일로 로그인
    </a>

    <!-- 이메일 로그인 패널 (접고 펼치기) -->
    <div class="email-panel" id="email-panel">
      <div class="alert-banner" id="email-alert"></div>

      <div class="form-group">
        <label class="form-label" for="input-email">이메일</label>
        <input
          type="email"
          id="input-email"
          class="form-input"
          placeholder="이메일을 입력하세요"
          autocomplete="email"
          onkeydown="if(event.key==='Enter') document.getElementById('input-pw').focus()"
        >
      </div>

      <div class="form-group">
        <label class="form-label" for="input-pw">비밀번호</label>
        <input
          type="password"
          id="input-pw"
          class="form-input"
          placeholder="비밀번호를 입력하세요"
          autocomplete="current-password"
          onkeydown="if(event.key==='Enter') submitEmailLogin()"
        >
      </div>

      <button class="btn-email-submit" id="btn-email-submit" onclick="submitEmailLogin()">
        <span id="email-btn-text">로그인</span>
        <div class="btn-spinner" id="email-spinner"></div>
      </button>
    </div><!-- /email-panel -->

    <!-- 홈으로 -->
    <a href="index.html" class="back-home">메인으로 돌아가기</a>

  </div><!-- /login-card -->
</main>

<!-- ── 카카오 플로팅 버튼 ── -->
<div class="kakao-float">
  <button class="kakao-btn" onclick="openKakao()" aria-label="카카오 상담">
    <svg viewBox="0 0 24 24" fill="none">
      <path d="M12 3C6.48 3 2 6.72 2 11.28c0 2.9 1.78 5.45 4.47 6.94L5.4 22l4.29-2.96A12.2 12.2 0 0012 19.56c5.52 0 10-3.72 10-8.28C22 6.72 17.52 3 12 3z" fill="#191919"/>
    </svg>
  </button>
  <div class="kakao-label">카카오 상담</div>
</div>

<!-- ── JS (공통 → 로그인 전용 순서) ── -->
<script src="js/utils.js"></script>
<script src="js/auth.js"></script>
<script src="js/api.js"></script>
<script src="js/login.js"></script>

</body>
</html>
