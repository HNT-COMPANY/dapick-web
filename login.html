
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>다픽 | 로그인</title>

  <!-- 폰트 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Noto+Sans+KR:wght@400;500;600;700;900&display=swap" rel="stylesheet">

  <!-- 공통 CSS -->
  <link rel="stylesheet" href="css/reset.css">
  <link rel="stylesheet" href="css/common/common.css">
    <link rel="stylesheet" href="css/common/gnb-user.css">

  <!-- 로그인 전용 CSS -->
  <link rel="stylesheet" href="css/logoin/login.css">

  <!-- 카카오 추가정보 모달 CSS (동의 모달 + 추가정보 모달 공통) -->
  <link rel="stylesheet" href="css/logoin/cs-modal.css">
</head>
<body>

<!-- ── GNB ── -->
<header class="gnb">
  <div class="gnb-top">
    <a class="logo" href="index.html">
      <img src="assets/logos/dapick.png" alt="다픽 아이콘" class="logo-wrap__img" />
    </a>
  </div>
</header>

<!-- ── 로그인 본문 ── -->
<main class="login-wrap">
  <div class="login-card">

    <!-- 헤더 (로고 + 태그라인) -->
    <div class="login-header">
      <a class="login-brand" href="index.html">
      <img src="assets/logos/dapick.png" alt="다픽 아이콘" class="logo-wrap__img" />
      </a>
      <p class="login-tagline">휴대폰 · 인터넷 · 카드 · 가전렌탈<br>다픽의 생활 플랫폼</p>
    </div>

    <!-- ── 소셜 버튼 그룹 ── -->
    <div class="social-group">

      <!-- 카카오 말풍선 -->
      <div class="kakao-balloon">카카오로 3초만에 시작하기</div>

      <!-- 카카오 -->
      <button class="social-btn btn-kakao" onclick="socialLogin('kakao')">
        <svg class="social-icon" viewBox="0 0 24 24">
          <path d="M12 3C6.48 3 2 6.72 2 11.28c0 2.9 1.78 5.45 4.47 6.94L5.4 22l4.29-2.96A12.2 12.2 0 0012 19.56c5.52 0 10-3.72 10-8.28C22 6.72 17.52 3 12 3z" fill="#191919"/>
        </svg>
        카카오로 시작하기
      </button>

      <!-- 네이버 -->
      <button class="social-btn btn-naver" onclick="socialLogin('naver')">
        <svg class="social-icon" viewBox="0 0 24 24">
          <path d="M13.5 12.6L10.2 7H7v10h3.5V11.4L14.1 17H17V7h-3.5v5.6z" fill="white"/>
        </svg>
        네이버로 시작하기
        <span class="soon-badge">준비중</span>
      </button>
    </div><!-- /social-group -->

    <!-- 구분선 -->
    <div class="login-divider">회원시스템</div>

    <!-- 회원가입 안내 -->
    <a href="signup.html" class="signup-link">
      처음이신가요? <strong>회원가입</strong>
    </a>

    <!-- 이메일 로그인 토글 링크 -->
    <a class="email-login-link" href="#" id="email-toggle" onclick="toggleEmail(event)">
      이메일로 로그인
    </a>

    <!-- 이메일 로그인 패널 (접고 펼치기) -->
    <div class="email-panel" id="email-panel">
      <div class="alert-banner" id="email-alert"></div>

      <div class="form-group">
        <label class="form-label" for="input-email">이메일</label>
        <input
          type="email"
          id="input-email"
          class="form-input"
          placeholder="이메일을 입력하세요"
          autocomplete="email"
          onkeydown="if(event.key==='Enter') document.getElementById('input-pw').focus()"
        >
      </div>

      <div class="form-group">
        <label class="form-label" for="input-pw">비밀번호</label>
        <input
          type="password"
          id="input-pw"
          class="form-input"
          placeholder="비밀번호를 입력하세요"
          autocomplete="current-password"
          onkeydown="if(event.key==='Enter') submitEmailLogin()"
        >
      </div>

      <button class="btn-email-submit" id="btn-email-submit" onclick="submitEmailLogin()">
        <span id="email-btn-text">로그인</span>
        <div class="btn-spinner" id="email-spinner"></div>
      </button>
    </div><!-- /email-panel -->

    <!-- 홈으로 -->
    <a href="index.html" class="back-home">메인으로 돌아가기</a>

  </div><!-- /login-card -->
</main>

<!-- ════ [1단계] 카카오 약관 동의 모달 ════ -->
<div class="cs-modal-overlay" id="ag-modal-overlay">
  <div class="cs-modal">
    <div class="cs-modal-head">
      <div class="cs-modal-title">약관 동의</div>
      <p class="cs-modal-greet">다픽 가입을 위해 약관에 동의해주세요</p>
    </div>

    <div class="alert-banner" id="ag-alert"></div>

    <div class="cs-modal-body">
      <div class="ag-group">
        <label class="ag-all">
          <input type="checkbox" id="ag-all" onchange="agToggleAll(this)">
          <span class="ag-text"><strong>전체 약관 동의</strong></span>
        </label>
        <div class="ag-list">
          <label class="ag-item">
            <input type="checkbox" id="ag-terms" class="ag-checkbox" onchange="agSyncAll()">
            <span class="ag-text">[필수] 이용약관 동의</span>
            <a href="terms.html" target="_blank" rel="noopener" class="ag-link">보기</a>
          </label>
          <label class="ag-item">
            <input type="checkbox" id="ag-privacy" class="ag-checkbox" onchange="agSyncAll()">
            <span class="ag-text">[필수] 개인정보처리방침 동의</span>
            <a href="privacy.html" target="_blank" rel="noopener" class="ag-link">보기</a>
          </label>
          <label class="ag-item">
            <input type="checkbox" id="ag-marketing" class="ag-checkbox" onchange="agSyncAll()">
            <span class="ag-text">[선택] 마케팅 정보 수신 동의</span>
            <a href="marketing.html" target="_blank" rel="noopener" class="ag-link">보기</a>
          </label>
        </div>
      </div>

      <button class="btn-cs-submit" id="ag-btn-submit" onclick="agSubmit()">동의하고 계속</button>
    </div>
  </div>
</div>

<!-- ════ [2단계] 카카오 추가정보 입력 모달 (PENDING_PROFILE → ACTIVE) ════ -->
<div class="cs-modal-overlay" id="cs-modal-overlay">
  <div class="cs-modal">
    <div class="cs-modal-head">
      <div class="cs-modal-title">추가 정보 입력</div>
      <p class="cs-modal-greet" id="cs-greeting">가입을 위해 정보를 입력해주세요</p>
    </div>

    <div class="alert-banner" id="cs-alert"></div>

    <div class="cs-modal-body">
      <!-- 이름 -->
      <div class="form-group">
        <label class="form-label" for="cs-name">이름</label>
        <input type="text" id="cs-name" class="form-input" placeholder="실명을 입력하세요" maxlength="10" autocomplete="name">
      </div>

      <!-- 전화번호 + SMS 발송 -->
      <div class="form-group">
        <label class="form-label" for="cs-phone">휴대폰 번호</label>
        <div class="input-with-btn">
          <input type="tel" id="cs-phone" class="form-input" placeholder="010-0000-0000" maxlength="13" autocomplete="tel">
          <button type="button" class="btn-action" id="cs-btn-sms" onclick="csSendSms()">인증번호 받기</button>
        </div>
      </div>

      <!-- SMS 인증코드 (발송 후 노출) -->
      <div class="form-group" id="cs-sms-group" style="display:none;">
        <label class="form-label" for="cs-smscode">인증번호</label>
        <div class="input-with-btn">
          <input type="text" id="cs-smscode" class="form-input" placeholder="6자리 숫자" maxlength="6" inputmode="numeric" autocomplete="one-time-code">
          <button type="button" class="btn-action" id="cs-btn-verify" onclick="csVerifySms()">확인</button>
        </div>
        <div class="cs-sms-timer-row">
          <span class="cs-sms-timer" id="cs-sms-timer">03:00</span>
          <button type="button" class="cs-sms-resend" onclick="csSendSms()">재발송</button>
        </div>
        <!-- 인증 완료 표시 (성공 시 노출) -->
        <p class="cs-sms-verified" id="cs-sms-verified" style="display:none;">✓ 인증이 완료되었습니다.</p>
      </div>

      <!-- 주소 (다음 우편번호) -->
      <div class="form-group">
        <label class="form-label" for="cs-address1">주소</label>
        <div class="input-with-btn">
          <input type="text" id="cs-zonecode" class="form-input" placeholder="우편번호" readonly style="max-width:120px;">
          <button type="button" class="btn-action" onclick="csOpenPostcode()">주소 검색</button>
        </div>
        <input type="text" id="cs-address1" class="form-input" placeholder="기본주소 (검색 버튼을 눌러주세요)" readonly style="margin-top:8px;" onclick="csOpenPostcode()">
        <input type="text" id="cs-address2" class="form-input" placeholder="상세주소 (동·호수 등)" maxlength="100" autocomplete="address-line2" style="margin-top:8px;">
      </div>

      <button class="btn-cs-submit" id="cs-btn-submit" onclick="csSubmit()" disabled>가입 완료</button>
      <p class="cs-modal-note">입력하신 정보는 상담·배송 안내에만 사용됩니다.</p>
    </div>
  </div>
</div>

<!-- ── 카카오 플로팅 버튼 ── -->
<div class="kakao-float">
  <button class="kakao-btn" onclick="openKakao()" aria-label="카카오 상담">
    <svg viewBox="0 0 24 24" fill="none">
      <path d="M12 3C6.48 3 2 6.72 2 11.28c0 2.9 1.78 5.45 4.47 6.94L5.4 22l4.29-2.96A12.2 12.2 0 0012 19.56c5.52 0 10-3.72 10-8.28C22 6.72 17.52 3 12 3z" fill="#191919"/>
    </svg>
  </button>
  <div class="kakao-label">카카오 상담</div>
</div>

<!-- ── 다음(카카오) 우편번호 API ── -->
<script src="//t1.daumcdn.net/mapjsapi/bundle/postcode/prod/postcode.v2.js"></script>

<!-- ── JS (공통 → 로그인 전용 순서) ── -->
<script src="js/common/utils.js"></script>
<script src="js/common/auth.js"></script>
<script src="js/common/api.js"></script>
<script src="js/login/login.js"></script>
<script src="js/common/gnb-user.js"></script>


</body>
</html>
