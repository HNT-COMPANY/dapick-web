<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>카테고리 | 다픽</title>

<!--
  ⚠ 아래 스크립트를 지우거나 <link> 아래로 내리지 말 것 (2026-08-03).

  무슨 일이 있었나:
    이 파일은 /c/{slug} 주소로 내려간다. 주소창이 한 단계 깊어지므로
    아래 css/reset.css 같은 상대 경로가 /c/css/reset.css 로 풀려 전부 어긋났다.
    Cloudflare 는 없는 주소에 index.html 을 대신 내주기 때문에 404 조차 아니고
    HTML 이 CSS 자리로 들어왔다. 브라우저는 그걸 조용히 버린다 —
    콘솔에 빨간 줄 하나 없이 스타일만 사라진다.

  왜 <base href="/"> 를 그냥 박지 않았나:
    그러면 로컬이 깨진다. Live Server 로 상위 폴더를 열면 이 파일은
    /dapick-web/category.html 로 열리는데, 거기서 루트를 / 로 고정하면
    css 를 사이트 최상위에서 찾아 로컬에서만 알몸이 된다.
    운영은 살고 로컬이 죽는 맞바꿈이라 쓸 수 없다.

  그래서 지금 주소에서 실제 루트를 계산해 <base> 를 만든다:
    운영  /c/water              → '/c/' 앞까지        → '/'
    로컬  /dapick-web/category.html → 파일이 든 폴더  → '/dapick-web/'
    하위경로 /sub/c/water       → '/c/' 앞까지        → '/sub/'
  파서는 위에서 아래로 읽으므로, 이 스크립트가 도는 시점에 아래 <link> 들은
  아직 만들어지지 않았다. 그래서 여기서 박은 base 가 그 전부에 적용된다.
-->
<script>
(function () {
  var p = location.pathname;
  var i = p.indexOf('/c/');
  var root = i >= 0 ? p.slice(0, i + 1) : p.replace(/[^/]*$/, '');
  var b = document.createElement('base');
  b.setAttribute('href', root);
  document.head.appendChild(b);
})();
</script>

<!--
  관리자가 만든 카테고리 페이지의 공용 틀 (2026-07-30).
  주소는 /c/{slug} 이고 _worker.js 가 이 파일을 내려준다.
  카테고리마다 파일을 만들지 않는다 — 정적 사이트라 관리자가 만든 만큼 파일을 늘릴 수 없다.
  로컬(Live Server)은 워커가 안 도니까 category.html?slug=xxx 로 연다.
-->

<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700;900&display=swap" rel="stylesheet">

<!-- 사이트 배너 — category.js 가 카테고리 id 를 넣고 site-banner.js 를 부른다.
     등록된 배너가 0장이면 이 영역은 스스로 숨는다. -->
<section class="sb" id="cg-banner" aria-label="카테고리 배너" hidden>

    <div class="sb__track"></div>
  </div>
  <button class="sb__arrow prev" type="button" aria-label="이전">‹</button>
  <button class="sb__arrow next" type="button" aria-label="다음">›</button>
  <div class="sb__dots"></div>
</section>

<main class="cg-wrap">
  <div class="cg-head">
    <h1 class="cg-title" id="cg-title">&nbsp;</h1>
    <p class="cg-desc" id="cg-desc"></p>
  </div>

  <!-- 서브카테고리(품목) 바 — 없으면 통째로 숨는다 -->

  <div class="cg-toolbar">
    <div class="cg-count" id="cg-count"></div>
    <div class="cg-sorts">
      <button type="button" class="cg-sort is-on" data-sort="default" onclick="cgSetSort('default')">기본순</button>
      <button type="button" class="cg-sort" data-sort="low" onclick="cgSetSort('low')">낮은 가격순</button>
      <button type="button" class="cg-sort" data-sort="high" onclick="cgSetSort('high')">높은 가격순</button>
    </div>
  </div>

  <div class="cg-grid" id="cg-grid"></div>
