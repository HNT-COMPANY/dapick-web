<main class="sup-wrap">
  <h1 class="sup-title">불편사항</h1>
  <p class="sup-sub">이용 중 겪으신 불편이나 개선 요청을 남겨주세요.</p>

  <div id="sup-form-wrap" class="sup-card">
    <form id="support-form" data-type="COMPLAINT" novalidate>
      <div class="sup-field">
        <label>이름<span class="req">*</span></label>
        <input type="text" name="applicantName" placeholder="홍길동" autocomplete="name" />
      </div>
      <div class="sup-field">
        <label>전화번호<span class="req">*</span></label>
        <input type="tel" name="applicantPhone" placeholder="010-1234-5678" autocomplete="tel" inputmode="numeric" maxlength="13" />
      </div>
      <div class="sup-field">
        <label>이메일<span class="req">*</span></label>
        <input type="email" name="applicantEmail" placeholder="example@dapick.co.kr" autocomplete="email" />
      </div>
      <div class="sup-field">
        <label>불편 내용<span class="req">*</span></label>
        <textarea name="content" placeholder="겪으신 불편이나 개선 요청을 입력해주세요."></textarea>
      </div>
      <p class="sup-err" id="sup-err"></p>
      <button type="submit" class="sup-submit" id="sup-submit">접수하기</button>
    </form>
  </div>

  <div id="sup-done" class="sup-card" style="display:none">
    <div class="sup-done">
      <div class="sup-done-emoji">🎉</div>
      <div class="sup-done-title">불편사항이 접수되었어요!</div>
      <div class="sup-done-num" id="sup-done-num">-</div>
      <div class="sup-done-msg" id="sup-done-msg"></div>
      <div class="sup-done-actions">
        <a class="sup-home" href="index.html">홈으로</a>
        <a class="sup-mypage" href="mypage.html">마이페이지</a>
      </div>
    </div>
  </div>
</main>
